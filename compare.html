<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Comparar — Seeker</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
  <link rel="stylesheet" href="styles.css">
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <style>
    .cmp-grid { display: grid; gap: 0; border: 1px solid var(--border-subtle); border-radius: var(--radius-lg); overflow: hidden; }
    .cmp-row { display: grid; border-bottom: 1px solid var(--border-subtle); }
    .cmp-row:last-child { border-bottom: none; }
    .cmp-label { background: var(--bg-surface); padding: 14px 16px; font-size: 13px; color: var(--text-muted); display: flex; align-items: center; gap: 8px; border-right: 1px solid var(--border-subtle); min-width: 140px; }
    .cmp-cell { background: var(--bg-card); padding: 14px 16px; font-size: 14px; border-right: 1px solid var(--border-subtle); display: flex; align-items: center; min-width: 0; }
    .cmp-cell:last-child { border-right: none; }
    .cmp-header-row { background: var(--bg-elevated); }
    .cmp-game-header { padding: 16px; text-align: center; border-right: 1px solid var(--border-subtle); }
    .cmp-game-header:last-child { border-right: none; }
    .cmp-game-icon { font-size: 32px; margin-bottom: 6px; }
    .cmp-game-name { font-size: 13px; font-weight: 600; line-height: 1.3; }
    .cmp-game-genre { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
    .win { background: rgba(110,232,130,0.08) !important; }
    .win-price { color: #6ee882; font-weight: 700; }
    .platform-link { display: flex; align-items: center; gap: 6px; font-size: 12px; padding: 4px 10px; border-radius: 4px; color: var(--text-secondary); border: 1px solid var(--border-subtle); background: var(--bg-elevated); transition: var(--transition); text-decoration: none; white-space: nowrap; }
    .platform-link:hover { border-color: var(--border-normal); color: var(--text-primary); }
    .add-slot { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 2rem 1rem; border: 1px dashed var(--border-normal); border-radius: var(--radius-lg); color: var(--text-muted); cursor: pointer; transition: var(--transition); min-width: 180px; }
    .add-slot:hover { border-color: var(--accent-main); color: var(--accent-main); background: var(--accent-soft); }
  </style>
</head>
<body>

<nav class="navbar">
  <a class="navbar-brand" href="index.html">SEEK<span>ER</span></a>
  <div class="navbar-actions">
    <a class="nav-link" href="index.html"><i class="ti ti-layout-grid"></i> Biblioteca</a>
    <a class="nav-link" href="favorites.html"><i class="ti ti-heart"></i> Favoritos</a>
    <a class="nav-link active" href="compare.html"><i class="ti ti-scale"></i> Comparar</a>
    <div id="nav-auth"></div>
  </div>
</nav>

<main>
  <div class="container page-content">
    <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:1.5rem; flex-wrap:wrap; gap:1rem;">
      <div>
        <h1 style="font-size:24px; margin-bottom:4px;"><i class="ti ti-scale" style="color:var(--accent-main)"></i> Comparar jogos</h1>
        <p style="color:var(--text-secondary); font-size:14px;">Compare preços lado a lado em todas as plataformas. Máximo 4 jogos.</p>
      </div>
      <button class="btn btn-ghost btn-sm" onclick="clearAll()"><i class="ti ti-trash"></i> Limpar tudo</button>
    </div>

    <!-- Selector de jogos -->
    <div id="slots-row" style="display:flex; gap:12px; flex-wrap:wrap; margin-bottom:2rem;"></div>

    <!-- Search to add -->
    <div id="search-panel" style="display:none; margin-bottom:2rem;">
      <div style="position:relative; max-width:400px;">
        <i class="ti ti-search" style="position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text-muted);font-size:16px;pointer-events:none;"></i>
        <input type="text" id="game-search" placeholder="Buscar jogo para adicionar..." style="padding-left:38px;" oninput="searchGames()">
      </div>
      <div id="search-results" style="margin-top:8px; display:flex; gap:8px; flex-wrap:wrap;"></div>
    </div>

    <!-- Compare table -->
    <div id="compare-output"></div>
  </div>
</main>

<div class="toast" id="toast"></div>

<script src="firebase.js"></script>
<script>
let allGames = [];
let compareList = JSON.parse(localStorage.getItem('seeker_compare') || '[]');

auth.onAuthStateChanged(user => {
  const el = document.getElementById('nav-auth');
  if (user) {
    const initials = (user.displayName||user.email||'U').slice(0,2).toUpperCase();
    el.innerHTML = `<div style="display:flex;align-items:center;gap:8px;">
      <a href="admin.html" class="btn btn-ghost btn-sm"><i class="ti ti-settings"></i></a>
      <div class="user-avatar">${initials}</div>
    </div>`;
  } else {
    el.innerHTML = `<button class="btn btn-primary btn-sm" onclick="auth.signInWithPopup(new firebase.auth.GoogleAuthProvider())"><i class="ti ti-login"></i> Entrar</button>`;
  }
});

async function loadGames() {
  const snap = await db.collection('games').orderBy('title').get();
  allGames = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  renderAll();
}

function saveCompare() {
  localStorage.setItem('seeker_compare', JSON.stringify(compareList));
}

function renderAll() {
  renderSlots();
  renderCompare();
}

function renderSlots() {
  const row = document.getElementById('slots-row');
  const items = compareList.map(id => allGames.find(g => g.id === id)).filter(Boolean);
  const canAdd = compareList.length < 4;

  row.innerHTML = items.map(g => `
    <div style="display:flex;align-items:center;gap:8px;background:var(--bg-card);border:1px solid var(--border-subtle);border-radius:var(--radius-md);padding:10px 14px;">
      <span style="font-size:20px">${g.icon||'🎮'}</span>
      <span style="font-size:14px;font-weight:500;max-width:120px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${g.title}</span>
      <button onclick="removeGame('${g.id}')" style="background:none;border:none;cursor:pointer;color:var(--text-muted);font-size:16px;padding:2px;" title="Remover"><i class="ti ti-x"></i></button>
    </div>`).join('') + (canAdd ? `
    <div class="add-slot" onclick="toggleSearch()">
      <i class="ti ti-plus" style="font-size:24px"></i>
      <span style="font-size:13px">Adicionar jogo</span>
    </div>` : '');
}

let searchOpen = false;
function toggleSearch() {
  searchOpen = !searchOpen;
  document.getElementById('search-panel').style.display = searchOpen ? 'block' : 'none';
  if (searchOpen) document.getElementById('game-search').focus();
}

function searchGames() {
  const q = document.getElementById('game-search').value.toLowerCase().trim();
  const results = document.getElementById('search-results');
  if (!q) { results.innerHTML = ''; return; }
  const found = allGames.filter(g => g.title.toLowerCase().includes(q) && !compareList.includes(g.id)).slice(0, 8);
  results.innerHTML = found.map(g => `
    <button onclick="addGame('${g.id}')" style="display:flex;align-items:center;gap:8px;background:var(--bg-card);border:1px solid var(--border-subtle);border-radius:var(--radius-sm);padding:8px 12px;cursor:pointer;color:var(--text-primary);font-size:13px;transition:var(--transition);" onmouseover="this.style.borderColor='var(--accent-main)'" onmouseout="this.style.borderColor='var(--border-subtle)'">
      <span>${g.icon||'🎮'}</span> ${g.title}
    </button>`).join('') || '<span style="font-size:13px;color:var(--text-muted)">Nenhum resultado</span>';
}

function addGame(id) {
  if (compareList.includes(id) || compareList.length >= 4) return;
  compareList.push(id);
  saveCompare();
  searchOpen = false;
  document.getElementById('search-panel').style.display = 'none';
  document.getElementById('game-search').value = '';
  renderAll();
}

function removeGame(id) {
  compareList = compareList.filter(x => x !== id);
  saveCompare();
  renderAll();
}

function clearAll() {
  compareList = [];
  saveCompare();
  renderAll();
  toast('Lista limpa', 'info');
}

function renderCompare() {
  const out = document.getElementById('compare-output');
  const games = compareList.map(id => allGames.find(g => g.id === id)).filter(Boolean);

  if (!games.length) {
    out.innerHTML = `
      <div style="text-align:center; padding:4rem 2rem; color:var(--text-muted);">
        <i class="ti ti-scale" style="font-size:48px;display:block;margin-bottom:1rem;opacity:.3;color:var(--accent-main)"></i>
        <h3 style="color:var(--text-secondary);font-size:18px;margin-bottom:8px">Nenhum jogo selecionado</h3>
        <p style="font-size:14px">Adicione jogos acima para comparar preços lado a lado.</p>
      </div>`;
    return;
  }

  // Collect all platforms across selected games
  const allPlatformKeys = [...new Set(games.flatMap(g => Object.keys(g.platforms||{})))].sort();

  const colCount = 1 + games.length;
  const gridStyle = `grid-template-columns: 160px ${games.map(()=>'1fr').join(' ')}`;

  // Header row
  const headerCells = games.map(g => `
    <div class="cmp-game-header">
      <div class="cmp-game-icon">${g.icon||'🎮'}</div>
      <div class="cmp-game-name">${g.title}</div>
      <div class="cmp-game-genre">${g.genre}</div>
    </div>`).join('');

  // Metacritic row
  const metaRow = `
    <div class="cmp-row" style="${gridStyle}">
      <div class="cmp-label"><i class="ti ti-star" style="font-size:14px"></i> Metacritic</div>
      ${games.map(g => {
        const cls = !g.metacritic ? '' : g.metacritic >= 85 ? 'meta-green' : g.metacritic >= 70 ? 'meta-yellow' : 'meta-red';
        return `<div class="cmp-cell"><span class="game-meta-score ${cls}" style="display:inline-block">${g.metacritic||'—'}</span></div>`;
      }).join('')}
    </div>`;

  // Year row
  const yearRow = `
    <div class="cmp-row" style="${gridStyle}">
      <div class="cmp-label"><i class="ti ti-calendar" style="font-size:14px"></i> Lançamento</div>
      ${games.map(g => `<div class="cmp-cell">${g.releaseYear||'—'}</div>`).join('')}
    </div>`;

  // Genre row
  const genreRow = `
    <div class="cmp-row" style="${gridStyle}">
      <div class="cmp-label"><i class="ti ti-tag" style="font-size:14px"></i> Gênero</div>
      ${games.map(g => `<div class="cmp-cell">${g.genre||'—'}</div>`).join('')}
    </div>`;

  // Platform price rows
  const platformRows = allPlatformKeys.map(key => {
    const info = PLATFORMS[key] || { label: key, color: '#888' };
    // Find best price among games that have this platform
    const gamePrices = games.map(g => g.platforms?.[key]?.price ?? null);
    const validPrices = gamePrices.filter(p => p !== null && p > 0);
    const bestPrice = validPrices.length ? Math.min(...validPrices) : null;

    const cells = games.map((g, i) => {
      const p = g.platforms?.[key];
      if (!p) return `<div class="cmp-cell" style="color:var(--text-muted)">—</div>`;
      const isBest = p.price > 0 && p.price === bestPrice;
      const isFree = p.price === 0;
      const discount = p.onSale && p.originalPrice
        ? `<span style="font-size:11px;color:#6ee882;margin-left:4px">-${Math.round((1-p.price/p.originalPrice)*100)}%</span>` : '';
      const priceStr = isFree ? '<span class="game-price-free">Grátis</span>'
        : `<span class="${isBest?'win-price':''}">R$ ${p.price.toFixed(2).replace('.',',')}</span>${discount}`;
      const link = `<a href="${p.url}" target="_blank" class="platform-link" onclick="event.stopPropagation()" style="margin-left:8px;"><i class="ti ti-external-link" style="font-size:12px"></i></a>`;
      return `<div class="cmp-cell${isBest&&!isFree?' win':''}">${priceStr}${link}</div>`;
    }).join('');

    return `
      <div class="cmp-row" style="${gridStyle}">
        <div class="cmp-label">
          <div class="plat-dot" style="background:${info.color};width:8px;height:8px;border-radius:50%;flex-shrink:0"></div>
          ${info.label}
        </div>
        ${cells}
      </div>`;
  }).join('');

  // Min price summary row
  const summaryRow = `
    <div class="cmp-row" style="${gridStyle}; background:var(--bg-elevated);">
      <div class="cmp-label" style="font-weight:600;color:var(--text-primary)"><i class="ti ti-coins" style="font-size:14px"></i> Menor preço</div>
      ${games.map(g => {
        const prices = Object.values(g.platforms||{}).map(p=>p.price).filter(p=>p>0);
        const min = prices.length ? Math.min(...prices) : null;
        const isFree = g.isFree || Object.values(g.platforms||{}).some(p=>p.price===0);
        return `<div class="cmp-cell" style="font-weight:700;font-size:16px;">
          ${isFree&&!min ? '<span class="game-price-free">Grátis</span>'
            : min ? `<span style="color:var(--accent-main)">R$ ${min.toFixed(2).replace('.',',')}</span>` : '—'}
        </div>`;
      }).join('')}
    </div>`;

  out.innerHTML = `
    <div style="overflow-x:auto;">
      <div class="cmp-grid" style="min-width:${160 + games.length * 180}px;">
        <div class="cmp-row cmp-header-row" style="${gridStyle}">
          <div class="cmp-label" style="font-size:12px;text-transform:uppercase;letter-spacing:.5px;">Jogo</div>
          ${headerCells}
        </div>
        ${genreRow}
        ${yearRow}
        ${metaRow}
        <div style="grid-column:1/-1;border-bottom:2px solid var(--border-accent);"></div>
        ${platformRows}
        ${summaryRow}
      </div>
    </div>
    <p style="font-size:12px;color:var(--text-muted);margin-top:.75rem;"><i class="ti ti-info-circle" style="font-size:12px"></i> Preços em BRL. Pode haver variação por região ou promoção ativa.</p>`;
}

let toastTimer;
function toast(msg, type='info') {
  const el = document.getElementById('toast');
  const icons = { success:'ti-check', error:'ti-alert-circle', info:'ti-info-circle' };
  el.className = `toast toast-${type} show`;
  el.innerHTML = `<i class="ti ${icons[type]}" style="font-size:16px"></i> ${msg}`;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 3000);
}

loadGames();
</script>
</body>
</html>
